<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kovium Wallet</title>
<style>
:root{--bg:#F8FAFC;--surf:#FFFFFF;--tx:#0F172A;--mu:#64748B;--ac:#0284C7;--ac2:#0088CC;--ln:rgba(15,23,42,.09);--glass:rgba(2,132,199,.08);--glassln:rgba(2,132,199,.2);--ok:#059669;--hero:linear-gradient(150deg,#0088CC 0%,#0369A1 55%,#1E3A8A 100%);--sh:0 12px 32px rgba(2,100,160,.12)}
[data-theme=dark]{--bg:#0A101C;--surf:#131C2E;--tx:#F1F5F9;--mu:#94A3B8;--ac:#38BDF8;--ac2:#38BDF8;--ln:rgba(255,255,255,.09);--glass:rgba(56,189,248,.1);--glassln:rgba(56,189,248,.25);--hero:linear-gradient(150deg,#0369A1 0%,#0C4A6E 55%,#172554 100%);--sh:0 12px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(120% 55% at 50% -8%,rgba(2,132,199,.14),transparent 62%);background-repeat:no-repeat;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari",sans-serif;min-height:100vh;display:flex;justify-content:center;transition:background .25s}
.app{width:100%;max-width:430px;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.hidden{display:none!important}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{color:var(--mu);font-size:14px;line-height:1.55;margin:0 0 18px}
svg{display:block}
.card{background:var(--surf);border:1px solid var(--ln);border-radius:22px;padding:22px;margin-bottom:14px}
.btn{width:100%;padding:16px;border-radius:18px;border:0;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ac);color:#fff;box-shadow:0 8px 20px rgba(2,132,199,.28)}
[data-theme=dark] .btn-p{color:#06101D}
.btn-s{background:var(--glass);color:var(--ac);border:1px solid var(--glassln);margin-top:10px}
.btn-d{background:transparent;color:#DC2626;border:1px solid rgba(220,38,38,.3);margin-top:10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.welcome{margin:auto 0;text-align:center}
.card.tight{padding:20px 14px}.tight h2,.tight>p{padding-inline:6px}.coinwrap{width:148px;height:148px;margin:0 auto 14px;position:relative}.coinwrap::before{content:"";position:absolute;inset:-34px;background:radial-gradient(closest-side,rgba(255,170,30,.38),transparent)}.coin{position:relative;width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 14px rgba(150,90,0,.35))}.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--hero);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.seedw{position:relative;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;transition:filter .3s}
.blur{filter:blur(8px);user-select:none;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ac);background:var(--glass);border:1px dashed var(--glassln)}
.pill{display:flex;align-items:center;gap:6px;height:46px;padding:0 9px;background:var(--bg);border:1px solid var(--ln);border-radius:13px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.pill span{color:var(--mu);font-size:11px;min-width:15px;text-align:center;flex:none}
.pill input{flex:1;min-width:0;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;border-radius:0;font-size:16px;color:var(--tx)}
.pill:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--glass)}
.pill.on{border-color:var(--glassln);background:var(--glass)}
.pill.lock{opacity:.45}
.pill.err{border-color:#DC2626}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:14px;border-radius:14px;font:14px inherit;font-family:inherit;margin-bottom:12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
.ql{font-size:13px;color:var(--ac);font-weight:600;margin-bottom:6px;display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand .coin{width:32px;height:32px;filter:drop-shadow(0 2px 4px rgba(150,90,0,.3))}
.badge{font-size:12px;font-weight:600;color:var(--ok);background:rgba(5,150,105,.12);padding:5px 11px;border-radius:20px}
.badge.off{color:#DC2626;background:rgba(220,38,38,.1)}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--glassln);background:var(--glass);color:var(--ac);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:26px 22px 22px;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero>*{position:relative}.hero .hw{position:absolute;width:190px;height:190px;inset-inline-end:-46px;top:-40px;opacity:.28;filter:none;pointer-events:none}
.hero small{opacity:.8;font-size:13px}
.amt{font-size:46px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 14px;display:flex;align-items:baseline;gap:8px;word-break:break-all}
.amt b{font-size:19px;font-weight:600;opacity:.85}
.addr{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;direction:ltr}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.act{background:var(--glass);border:1px solid var(--glassln);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:14px 6px;text-align:center;cursor:pointer;color:var(--tx);font:600 13px inherit;font-family:inherit}
.act:active{transform:scale(.97)}
.chip{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--surf);color:var(--ac);border:1px solid var(--glassln)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.row .l{font-size:14px;color:var(--mu)}
.row .v{font-weight:600;font-size:14px;text-align:end}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surf);width:100%;max-width:430px;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{margin:0}
.qr{background:#fff;border-radius:18px;padding:10px;width:216px;margin:0 auto 14px;border:1px solid var(--ln)}
.qr svg{width:100%;height:auto}
.fa{background:var(--bg);padding:13px;border-radius:14px;word-break:break-all;font-size:13px;margin-bottom:14px;border:1px solid var(--ln);direction:ltr;text-align:center}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw s{position:absolute;inset:0;border-radius:20px;background:var(--ln);transition:.2s}
.sw s::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+s{background:var(--ac)}
.sw input:checked+s::after{inset-inline-start:23px}
.sw input:focus-visible+s{outline:2px solid var(--ac);outline-offset:2px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:100;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div class="app">

<div id="screen-welcome" class="welcome">
  <div class="coinwrap"><img class="coin" alt="Kovium"></div>
  <h1 style="font-size:34px;letter-spacing:.01em">Kovium</h1>
  <p data-i="sub"></p>
  <button class="btn btn-p" onclick="startCreateWallet()" data-i="create"></button>
  <button class="btn btn-s" onclick="openImport()" data-i="imp"></button>
</div>

<div id="screen-seed" class="card tight hidden" style="margin:auto 0">
  <h2 data-i="phrase"></h2>
  <p data-i="phraseSub"></p>
  <div class="seedw">
    <div id="seed-grid" class="grid blur"></div>
    <div id="reveal-btn" class="ov" onclick="revealSeed()" data-i="reveal"></div>
  </div>
  <button class="btn btn-s" onclick="copySeed()" data-i="copy"></button>
  <button class="btn btn-p" style="margin-top:10px" onclick="startQuiz()" data-i="saved"></button>
</div>

<div id="screen-quiz" class="card tight hidden" style="margin:auto 0">
  <h2 data-i="verifyT"></h2>
  <p data-i="verifySub"></p>
  <div id="quiz-grid" class="grid" dir="ltr" style="margin-bottom:16px"></div>
  <button class="btn btn-p" onclick="verifyQuiz()" data-i="verify"></button>
  <button class="btn btn-s" onclick="showScreen('screen-seed')" data-i="back"></button>
</div>

<div id="screen-import" class="card tight hidden" style="margin:auto 0">
  <h2 data-i="imp"></h2>
  <p data-i="impSub"></p>
  <div id="import-grid" class="grid" dir="ltr" style="margin-bottom:16px"></div>
  <button class="btn btn-p" onclick="processImport()" data-i="restore"></button>
  <button class="btn btn-s" onclick="showScreen('screen-welcome')" data-i="back"></button>
</div>

<div id="screen-main" class="hidden">
  <div class="top">
    <div class="brand"><img class="coin" alt="">Kovium</div>
    <span class="badge" id="net-badge"></span>
    <button class="ib" onclick="openModal('modal-settings')" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="hero">
    <img class="coin hw" alt="">
    <small data-i="bal"></small>
    <div class="amt"><span id="bal-val">0</span><b>KOV</b></div>
    <div class="addr" onclick="copyAddress()" id="addr-display">kov1...</div>
  </div>
  <div class="acts">
    <button class="act" onclick="openModal('modal-send')"><div class="chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></div><span data-i="send"></span></button>
    <button class="act" onclick="openModal('modal-receive')"><div class="chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg></div><span data-i="recv"></span></button>
    <button class="act" id="mine-btn" onclick="mineOneCoin()"><div class="chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><span data-i="mine"></span></button>
  </div>
  <div class="card">
    <div class="row"><div style="display:flex;align-items:center;gap:11px"><img class="coin" alt="" style="width:40px;height:40px;flex:none"><div><div style="font-weight:700">Kovium</div><div class="l" style="font-size:12px"><span data-i="max"></span>: 24,000,000 KOV</div></div></div><div class="v"><div id="asset-bal">0 KOV</div><div style="font-size:12px;color:var(--ok)" data-i="burn"></div></div></div>
    <div class="row"><span class="l" data-i="minted"></span><span class="v" id="net-minted">0 KOV</span></div>
  </div>
</div>
</div>

<div id="modal-send" class="modal hidden" onclick="if(event.target===this)closeModals()"><div class="sheet">
  <div class="sh"><h3 data-i="send"></h3><button class="ib" onclick="closeModals()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <p data-i="burn"></p>
  <input type="text" id="send-to" data-ph="to" dir="ltr" autocomplete="off">
  <input type="number" id="send-amt" data-ph="amt" inputmode="decimal">
  <button class="btn btn-p" onclick="sendKov()" data-i="confirm"></button>
</div></div>

<div id="modal-receive" class="modal hidden" onclick="if(event.target===this)closeModals()"><div class="sheet" style="text-align:center">
  <div class="sh"><h3 data-i="recv"></h3><button class="ib" onclick="closeModals()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <p data-i="addrSub"></p>
  <div class="qr hidden" id="qr"></div>
  <div class="fa" id="full-addr"></div>
  <button class="btn btn-p" onclick="copyAddress()" data-i="copyAddr"></button>
</div></div>

<div id="modal-settings" class="modal hidden" onclick="if(event.target===this)closeModals()"><div class="sheet">
  <div class="sh"><h3 data-i="settings"></h3><button class="ib" onclick="closeModals()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="set"><span data-i="theme"></span><label class="sw"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')"><s></s></label></div>
  <div class="set" style="border:0;padding-bottom:6px"><span data-i="lang"></span></div>
  <select id="lang-select" onchange="setLang(this.value)">
    <option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="tr">Türkçe</option><option value="hi">हिन्दी</option><option value="id">Bahasa Indonesia</option>
  </select>
  <button class="btn btn-s" style="margin-top:0" onclick="openBackup()" data-i="backup"></button>
  <button class="btn btn-d" onclick="logoutWallet()" data-i="logout"></button>
</div></div>

<div id="modal-backup" class="modal hidden" onclick="if(event.target===this)closeModals()"><div class="sheet">
  <div class="sh"><h3 data-i="phrase"></h3><button class="ib" onclick="closeModals()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="backup-grid" class="grid" dir="ltr" style="margin-bottom:14px"></div>
  <button class="btn btn-s" style="margin-top:0" onclick="copyStored()" data-i="copy"></button>
</div></div>

/* ---------- QR (byte mode, ECC L, versions 1-5, mask 0) ---------- */
function qrSvg(text) {
  const bytes = Array.from(new TextEncoder().encode(text));
  const spec = [null, [19, 7], [34, 10], [55, 15], [80, 20], [108, 26]];
  let v = 1; while (v <= 5 && bytes.length + 2 > spec[v][0]) v++;
  if (v > 5) throw new Error("qr too long");
  const dc = spec[v][0], ec = spec[v][1], n = 17 + 4 * v;
  const bits = [], put = (x, l) => { for (let i = l - 1; i >= 0; i--) bits.push((x >> i) & 1); };
  put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
  for (let i = 0; i < 4 && bits.length < dc * 8; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
  for (let p = 0; data.length < dc; p ^= 1) data.push(p ? 0x11 : 0xEC);
  const E = [], L = []; let x = 1;
  for (let i = 0; i < 255; i++) { E[i] = x; L[x] = i; x <<= 1; if (x > 255) x ^= 0x11d; }
  const mul = (a, b) => a && b ? E[(L[a] + L[b]) % 255] : 0;
  let g = [1];
  for (let i = 0; i < ec; i++) {
    const h = new Array(g.length + 1).fill(0);
    g.forEach((c, j) => { h[j] ^= c; h[j + 1] ^= mul(c, E[i]); });
    g = h;
  }
  const r = new Array(ec).fill(0);
  data.forEach(d => { const f = d ^ r.shift(); r.push(0); if (f) g.slice(1).forEach((c, j) => { r[j] ^= mul(c, f); }); });
  const cw = data.concat(r);
  const M = Array.from({ length: n }, () => new Array(n).fill(null));
  const set = (a, b, val) => { if (a >= 0 && b >= 0 && a < n && b < n) M[a][b] = val; };
  const finder = (a, b) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) {
    const d = Math.max(Math.abs(i - 3), Math.abs(j - 3));
    set(a + i, b + j, i >= 0 && i <= 6 && j >= 0 && j <= 6 && d !== 2);
  } };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  if (v >= 2) { const p = n - 7; for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) set(p + i, p + j, Math.max(Math.abs(i), Math.abs(j)) !== 1); }
  for (let i = 8; i < n - 8; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  let f = 8 << 10;
  for (let i = 14; i >= 10; i--) if ((f >> i) & 1) f ^= 0x537 << (i - 10);
  const fb = ((8 << 10) | (f & 0x3ff)) ^ 0x5412;
  for (let i = 0; i < 15; i++) {
    const b = !!((fb >> i) & 1);
    set(i < 6 ? i : i < 8 ? i + 1 : n - 15 + i, 8, b);
    set(8, i < 8 ? n - i - 1 : i < 9 ? 15 - i : 14 - i, b);
  }
  M[n - 8][8] = true;
  let inc = -1, row = n - 1, bi = 7, by = 0;
  for (let col = n - 1; col > 0; col -= 2) {
    if (col === 6) col--;
    for (;;) {
      for (let c = 0; c < 2; c++) {
        if (M[row][col - c] === null) {
          let dark = by < cw.length ? ((cw[by] >>> bi) & 1) === 1 : false;
          if ((row + col - c) % 2 === 0) dark = !dark;
          M[row][col - c] = dark;
          if (--bi < 0) { by++; bi = 7; }
        }
      }
      row += inc;
      if (row < 0 || row >= n) { row -= inc; inc = -inc; break; }
    }
  }
  let d = "";
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) if (M[a][b]) d += `M${b + 4} ${a + 4}h1v1h-1z`;
  const s = n + 8;
  return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ---------- 24 word boxes ---------- */
function buildBoxes(id, active) {
  const g = document.getElementById(id);
  g.innerHTML = "";
  for (let i = 0; i < 24; i++) {
    const on = !active || active.includes(i);
    const c = document.createElement("div");
    c.className = "pill" + (on ? "" : " lock") + (active && on ? " on" : "");
    const n = document.createElement("span"); n.textContent = i + 1;
    const inp = document.createElement("input");
    inp.id = id === "quiz-grid" ? "quiz-word-" + i : id + "-" + i;
    inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
    inp.setAttribute("autocorrect", "off"); inp.enterKeyHint = "next"; inp.dir = "ltr";
    if (!on) { inp.disabled = true; inp.placeholder = "•••"; }
    c.append(n, inp); g.appendChild(c);
  }
  const eds = Array.from(g.querySelectorAll("input:not(:disabled)"));
  eds.forEach((inp, k) => {
    inp.addEventListener("input", () => {
      inp.parentNode.classList.remove("err");
      if (!/\s/.test(inp.value)) return;
      const parts = inp.value.toLowerCase().split(/\s+/).filter(Boolean);
      if (!parts.length) { inp.value = ""; return; }
      parts.forEach((w, j) => { if (eds[k + j]) { eds[k + j].value = w; eds[k + j].parentNode.classList.remove("err"); } });
      eds[Math.min(k + parts.length, eds.length - 1)].focus();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && k > 0) { e.preventDefault(); eds[k - 1].focus(); }
      else if (e.key === "Enter") { e.preventDefault(); if (eds[k + 1]) eds[k + 1].focus(); else inp.blur(); }
    });
  });
  return eds;
}
function readBoxes(id) {
  return Array.from(document.getElementById(id).querySelectorAll("input")).map(i => i.value.trim().toLowerCase());
}

function toast(msg) {
  const el = document.getElementById("toast");

  document.getElementById(id).classList.remove("hidden");
}
async function deriveAddress(words) {
  const enc = new TextEncoder().encode("kovium-ml-dsa-65:" + words.join(" "));
  const hashBuf = await crypto.subtle.digest("SHA-256", enc);
  const hex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, "0")).join("");
  return "kov1" + hex.slice(0, 38);
}
function renderWords(gridId, words) {
  document.getElementById(gridId).innerHTML = words.map((w, i) => `<div class="pill"><span>${i + 1}.</span>${w}</div>`).join("");
}
function startCreateWallet() {
  const rnd = new Uint32Array(24);
  crypto.getRandomValues(rnd);
  currentSeed = Array.from(rnd).map(n => WORDLIST[n % WORDLIST.length]);
  renderWords("seed-grid", currentSeed);
  document.getElementById("seed-grid").classList.add("blur");
  document.getElementById("reveal-btn").classList.remove("hidden");
  showScreen("screen-seed");
}

function startQuiz() {
  const pool = Array.from({ length: 24 }, (_, i) => i).sort(() => Math.random() - 0.5);
  quizIndices = pool.slice(0, 3).sort((a, b) => a - b);
  const eds = buildBoxes("quiz-grid", quizIndices);
  showScreen("screen-quiz");
  if (eds[0]) eds[0].focus();

async function verifyQuiz() {
  for (const idx of quizIndices) {
    const val = document.getElementById(`quiz-word-${idx}`).value.trim().toLowerCase();
    if (val !== currentSeed[idx]) return toast(t("bad") + " (#" + (idx + 1) + ")");
  }
  walletAddress = await deriveAddress(currentSeed);
  localStorage.setItem("kov_seed", currentSeed.join(" "));
  localStorage.setItem("kov_addr", walletAddress);
  toast(t("ok"));
  loadDashboard();
}

    document.querySelectorAll("#import-grid .pill").forEach((c, i) => c.classList.toggle("err", !raw[i]));

  }
  currentSeed = raw;
  walletAddress = await deriveAddress(currentSeed);
  localStorage.setItem("kov_seed", currentSeed.join(" "));
  localStorage.setItem("kov_addr", walletAddress);

async function rpcCall(method, params = {}) {
  const res = await fetch("/api/rpc", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", method, params, id: Date.now() })
  });
  return res.json();
}

  if (!walletAddress) return;
  try {
    const st = await (await fetch("/api/status")).json();
    setBadge("live");
    document.getElementById("net-minted").innerText = (st.total_minted || 0) + " KOV";
    const b = await rpcCall("balance", { address: walletAddress });
    const bal = b.result && b.result.balance !== undefined ? b.result.balance : 0;
    document.getElementById("bal-val").innerText = bal;
    document.getElementById("asset-bal").innerText = bal + " KOV";
  } catch (e) { setBadge("off"); }
}

function closeModals() { document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden")); }
function loadDashboard() {
  document.getElementById("addr-display").innerText = walletAddress.slice(0, 10) + "..." + walletAddress.slice(-6);
  document.getElementById("full-addr").innerText = walletAddress;
  showScreen("screen-main");
  refreshBalance();
}

window.onload = () => {
  document.querySelectorAll("img.coin").forEach(i => i.src = LOGO);
  const fi = document.createElement("link"); fi.rel = "icon"; fi.href = LOGO; document.head.appendChild(fi);
  let sl = "en", sth = "light", saved = null;
  try { sl = localStorage.getItem("kov_lang") || "en"; sth = localStorage.getItem("kov_theme") || "light"; saved = localStorage.getItem("kov_addr"); } catch (e) {}
  setTheme(sth); setLang(sl);
  if (!DEV_MINT) document.getElementById("mine-btn").classList.add("hidden");
  if (saved) { walletAddress = saved; loadDashboard(); }
  setInterval(refreshBalance, 5000);
};
</script>
</body>
</html>
